services:
  db:
    image: postgres:16-alpine
    container_name: uspsimgame-db
    restart: always
    environment:
      POSTGRES_DB: uspsimgame_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uspsimgame_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uspsimgame-web
    restart: always
    ports:
      - "5261:5261"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=uspsimgame_db;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
